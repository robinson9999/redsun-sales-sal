<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>REDSUN - Đăng nhập Quy chế Lương thưởng Kinh doanh</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
       font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       background:radial-gradient(1200px 600px at 20% 0%,#7F1D1D 0%,#450A0A 40%,#0f172a 100%);color:#0f172a}
  .card{width:100%;max-width:400px;background:#fff;border-radius:24px;box-shadow:0 25px 60px rgba(0,0,0,.35);overflow:hidden}
  .top{background:linear-gradient(135deg,#450A0A,#0f172a 60%,#7F1D1D);padding:28px 28px 22px;text-align:center}
  .logo{height:64px;margin:0 auto;background:url(/*__LOGO__*/) center/contain no-repeat;aspect-ratio:378/140}
  .top p{color:#cbd5e1;font-size:13px;margin:12px 0 0}
  form{padding:26px 28px 28px}
  h1{font-size:18px;margin:0 0 4px;font-weight:800}
  .sub{font-size:13px;color:#64748b;margin:0 0 18px}
  label{display:block;font-size:12px;font-weight:700;color:#334155;margin:14px 0 6px}
  input{width:100%;padding:12px 14px;border:1.5px solid #cbd5e1;border-radius:12px;font-size:15px;font-family:inherit;outline:none}
  input:focus{border-color:#DC2626;box-shadow:0 0 0 3px #FEE2E2}
  .pw{position:relative}.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:#64748b;font-size:12px;cursor:pointer;padding:6px}
  .submit{margin-top:20px;width:100%;padding:13px;border:0;border-radius:12px;background:#B91C1C;color:#fff;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit}
  .submit:hover{background:#991B1B}.submit:disabled{opacity:.6;cursor:wait}
  .err{display:none;margin-top:14px;padding:10px 12px;border-radius:10px;background:#FEF2F2;color:#991B1B;font-size:13px}
  .foot{font-size:11.5px;color:#94a3b8;text-align:center;margin-top:16px;line-height:1.6}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="logo" role="img" aria-label="Redsun - For Growth Together"></div>
    <p>Quy chế Lương, Thưởng & KPI Khối Kinh Doanh</p>
  </div>
  <form id="f" autocomplete="on">
    <h1>Đăng nhập</h1>
    <p class="sub">Tài liệu nội bộ, chỉ dành cho nhân sự được cấp tài khoản.</p>
    <label for="u">Tài khoản hoặc email</label>
    <input id="u" name="username" autocomplete="username" required autofocus>
    <label for="p">Mật khẩu</label>
    <div class="pw">
      <input id="p" name="password" type="password" autocomplete="current-password" required>
      <button type="button" id="toggle" aria-label="Hiện mật khẩu">Hiện</button>
    </div>
    <button class="submit" id="btn" type="submit">Đăng nhập</button>
    <div class="err" id="err" role="alert"></div>
    <p class="foot">Quên mật khẩu hoặc chưa có tài khoản: liên hệ Phòng Hành chính - Nhân sự.<br>Không chia sẻ tài khoản cho người khác. • Bản phát hành __BUILD__</p>
  </form>
</div>
<script>
(function(){
  var DATA = "__DATA__";
  var subtle = window.crypto && window.crypto.subtle;
  var te = new TextEncoder(), td = new TextDecoder();
  function ub64(s){ var b=atob(s), a=new Uint8Array(b.length); for(var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
  function $(id){ return document.getElementById(id); }
  function showErr(m){ var e=$('err'); e.textContent=m; e.style.display='block'; }

  async function openPage(keyB64){
    var key = await subtle.importKey('raw', ub64(keyB64), 'AES-GCM', false, ['decrypt']);
    var pt = await subtle.decrypt({name:'AES-GCM', iv: ub64(DATA.iv)}, key, ub64(DATA.ct));
    var html = td.decode(pt);
    document.open(); document.write(html); document.close();
  }

  async function login(user, pass){
    var norm = user.trim().toLowerCase();
    var h = await subtle.digest('SHA-256', te.encode('redsun|' + norm));
    var id = Array.from(new Uint8Array(h)).map(function(b){return b.toString(16).padStart(2,'0');}).join('').slice(0,32);
    var rec = DATA.u[id];
    if (!rec) throw new Error('bad');
    var base = await subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
    var kek = await subtle.deriveKey({name:'PBKDF2', hash:'SHA-256', salt: ub64(rec[0]), iterations: DATA.it},
                                     base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var raw = await subtle.decrypt({name:'AES-GCM', iv: ub64(rec[1])}, kek, ub64(rec[2]));
    return JSON.parse(td.decode(raw));
  }

  if (!subtle){ showErr('Trình duyệt không hỗ trợ. Vui lòng mở bằng Chrome, Edge, Safari hoặc Firefox bản mới qua địa chỉ https.'); $('btn').disabled = true; return; }

  // Còn phiên trong tab này thì mở luôn
  try {
    var s = JSON.parse(sessionStorage.getItem('rs_session') || 'null');
    if (s && s.k) {
      var go = function(){ openPage(s.k).catch(function(){ try{ sessionStorage.removeItem('rs_session'); }catch(e){} }); };
      if (document.readyState === 'complete') go(); else window.addEventListener('load', go);
    }
  } catch(e){}

  $('toggle').onclick = function(){ var p=$('p'); var show = p.type==='password'; p.type = show?'text':'password'; this.textContent = show?'Ẩn':'Hiện'; };

  var fails = 0;
  $('f').addEventListener('submit', async function(ev){
    ev.preventDefault();
    $('err').style.display='none';
    var btn = $('btn'); btn.disabled = true; btn.textContent = 'Đang kiểm tra...';
    try {
      var r = await login($('u').value, $('p').value);
      try { sessionStorage.setItem('rs_session', JSON.stringify({k:r.k, name:r.n})); } catch(e){}
      await openPage(r.k);
    } catch(e) {
      fails++;
      await new Promise(function(res){ setTimeout(res, Math.min(fails, 5) * 800); });
      showErr('Tài khoản hoặc mật khẩu không đúng.');
      btn.disabled = false; btn.textContent = 'Đăng nhập';
      $('p').select();
    }
  });
})();
</script>
</body>
</html>
