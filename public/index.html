  var subtle = window.crypto && window.crypto.subtle;
  var te = new TextEncoder(), td = new TextDecoder();
  function ub64(s){ var b=atob(s), a=new Uint8Array(b.length); for(var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
  function $(id){ return document.getElementById(id); }
  function showErr(m){ var e=$('err'); e.textContent=m; e.style.display='block'; }

  async function openPage(keyB64){
    var key = await subtle.importKey('raw', ub64(keyB64), 'AES-GCM', false, ['decrypt']);
    var pt = await subtle.decrypt({name:'AES-GCM', iv: ub64(DATA.iv)}, key, ub64(DATA.ct));
    var html = td.decode(pt);
    document.open(); document.write(html); document.close();
  }

  async function login(user, pass){
    var norm = user.trim().toLowerCase();
    var h = await subtle.digest('SHA-256', te.encode('redsun|' + norm));
    var id = Array.from(new Uint8Array(h)).map(function(b){return b.toString(16).padStart(2,'0');}).join('').slice(0,32);
    var rec = DATA.u[id];
    if (!rec) throw new Error('bad');
    var base = await subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
    var kek = await subtle.deriveKey({name:'PBKDF2', hash:'SHA-256', salt: ub64(rec[0]), iterations: DATA.it},
                                     base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var raw = await subtle.decrypt({name:'AES-GCM', iv: ub64(rec[1])}, kek, ub64(rec[2]));
    return JSON.parse(td.decode(raw));
  }

  if (!subtle){ showErr('Trình duyệt không hỗ trợ. Vui lòng mở bằng Chrome, Edge, Safari hoặc Firefox bản mới qua địa chỉ https.'); $('btn').disabled = true; return; }

  // Còn phiên trong tab này thì mở luôn
  try {
    var s = JSON.parse(sessionStorage.getItem('rs_session') || 'null');
    if (s && s.k) {
      var go = function(){ openPage(s.k).catch(function(){ try{ sessionStorage.removeItem('rs_session'); }catch(e){} }); };
      if (document.readyState === 'complete') go(); else window.addEventListener('load', go);
    }
  } catch(e){}

  $('toggle').onclick = function(){ var p=$('p'); var show = p.type==='password'; p.type = show?'text':'password'; this.textContent = show?'Ẩn':'Hiện'; };

  var fails = 0;
  $('f').addEventListener('submit', async function(ev){
    ev.preventDefault();
    $('err').style.display='none';
    var btn = $('btn'); btn.disabled = true; btn.textContent = 'Đang kiểm tra...';
    try {
      var r = await login($('u').value, $('p').value);
      try { sessionStorage.setItem('rs_session', JSON.stringify({k:r.k, name:r.n})); } catch(e){}
      await openPage(r.k);
    } catch(e) {
      fails++;
      await new Promise(function(res){ setTimeout(res, Math.min(fails, 5) * 800); });
      showErr('Tài khoản hoặc mật khẩu không đúng.');
      btn.disabled = false; btn.textContent = 'Đăng nhập';
      $('p').select();
    }
  });
})();
</script>
